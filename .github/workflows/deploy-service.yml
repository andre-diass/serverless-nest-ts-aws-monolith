  update-tags:
    runs-on: ubuntu-latest
    needs: [generate-image-tag]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Image Tags
        env:
          IMAGE_TAG: ${{ needs.generate-image-tag.outputs.image_tag }}
        run: |
          git clone https://github.com/andre-diass/kubernetes-devbox-environment.git
          echo ${IMAGE_TAG}
          cd kubernetes-devbox-environment/04-deploy-to-multiple-environments-kluctl/services/api-node/config
          sed -i "s/version: .*/version: ${IMAGE_TAG}/g" dev.yaml
          git config --global user.email "andrediassantoss@hotmail.com"
          git config --global user.name "andre-diass"
          git add .
          git commit -m "Update image for ${{ github.event.repository.name }} to ${IMAGE_TAG}"
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/andre-diass/kubernetes-devbox-environment.git main

name: Build and Deploy

on:
  push:
    branches:
      - test-pipeline # Change if needed

permissions:
  contents: write # Allows pushing tags

jobs:
  generate-image-tag:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.generate-image-tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for git describe to work properly

      - name: Check & Increment Tag
        id: versioning
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Use GitHub token for authentication
        run: |
          # Configure Git with GitHub Actions token
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions[bot]"

          # Fetch all tags
          git fetch --tags

          # Get the latest semver tag (sorted by version)
          latest_tag=$(git tag -l --sort=-v:refname | grep -E "^[0-9]+\.[0-9]+\.[0-9]+$" | head -n 1)

          # If no tag exists, start with 1.0.0
          if [[ -z "$latest_tag" ]]; then
            new_tag="1.0.0"
          else
            # Extract major, minor, and patch numbers
            IFS='.' read -r major minor patch <<< "$latest_tag"
            new_tag="$major.$minor.$((patch + 1))"
          fi

          # Create and push new tag
          git tag "$new_tag"
          git push origin "$new_tag"

          echo "New tag created: $new_tag"
          echo "new_tag=$new_tag" >> "$GITHUB_ENV"

      - name: Generate Image Tag
        id: generate-image-tag
        run: |
          image_tag=${{ env.new_tag }}
          echo "Generated Image Tag: $image_tag"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

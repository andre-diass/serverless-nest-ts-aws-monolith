name: Build and Deploy

on:
  push:
    branches:
      - main # Change if needed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker to use GCP Artifact Registry
        run: gcloud auth configure-docker REGION-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME=REGION-docker.pkg.dev/PROJECT_ID/REPO_NAME/${{ github.event.repository.name }}
          TAG=$(git rev-parse --short HEAD)
          docker build -t $IMAGE_NAME:$TAG .
          docker push $IMAGE_NAME:$TAG

      - name: Update Kubernetes Manifests Repo
        run: |
          git clone https://github.com/your-org/k8s-manifests.git
          cd k8s-manifests
          sed -i "s|image: .*|image: $IMAGE_NAME:$TAG|g" deployments/${{ github.event.repository.name }}.yaml
          git config --global user.email "your-email@example.com"
          git config --global user.name "your-bot-name"
          git add .
          git commit -m "Update image for ${{ github.event.repository.name }} to $TAG"
          git push https://your-bot-token@github.com/your-org/k8s-manifests.git main
